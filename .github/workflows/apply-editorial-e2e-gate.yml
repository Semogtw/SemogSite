name: Apply verified editorial E2E gate

on:
  push:
    branches:
      - ops/apply-editorial-e2e-v1
    paths:
      - .agent-patches/e2e-trigger.json

permissions:
  contents: write

concurrency:
  group: apply-editorial-e2e-gate
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout fixed request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: request
          persist-credentials: false
          sparse-checkout: .agent-patches
          sparse-checkout-cone-mode: false

      - name: Validate request and assemble patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path('request/.agent-patches/e2e-trigger.json').read_text())
          expected = {
              'repository': 'Semogtw/SemogSite',
              'branch': 'develop/editorial-workspace',
              'expected_head': 'da06a49ac9d53e268984d3db99f24e8814eee2fa',
              'base_commit': 'da06a49ac9d53e268984d3db99f24e8814eee2fa',
              'patch_sha256': '570a194a36f443f7ee00ca40950ebd68b2d25814139cbef1dc02488c40bef15e',
              'expected_tree': '2e3f637401a9fc268767f2f81b9b22c16066b3c8',
              'commit_message': 'test(web): version editorial browser gate and safe replacement',
          }
          if request != expected:
              raise SystemExit('Request differs from the reviewed fixed contract')
          PY
          cat request/.agent-patches/e2e-part-* \
            | tr -d '\n' \
            | base64 --decode \
            | gzip --decompress > "$RUNNER_TEMP/editorial-e2e.patch"
          test "$(sha256sum "$RUNNER_TEMP/editorial-e2e.patch" | awk '{print $1}')" = \
            '570a194a36f443f7ee00ca40950ebd68b2d25814139cbef1dc02488c40bef15e'

      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: develop/editorial-workspace
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified tree and push with lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = 'da06a49ac9d53e268984d3db99f24e8814eee2fa'
          git -C target reset --hard 'da06a49ac9d53e268984d3db99f24e8814eee2fa'
          git -C target apply --index "$RUNNER_TEMP/editorial-e2e.patch"
          git -C target diff --cached --check
          test "$(git -C target write-tree)" = '2e3f637401a9fc268767f2f81b9b22c16066b3c8'
          git -C target config user.name 'Arthur Almeida'
          git -C target config user.email 'arthurgva1602@gmail.com'
          git -C target commit -m 'test(web): version editorial browser gate and safe replacement'
          git -C target push \
            --force-with-lease='refs/heads/develop/editorial-workspace:da06a49ac9d53e268984d3db99f24e8814eee2fa' \
            origin HEAD:refs/heads/develop/editorial-workspace
