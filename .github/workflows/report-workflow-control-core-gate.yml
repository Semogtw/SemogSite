name: Report workflow control core gate

on:
  workflow_run:
    workflows:
      - Workflow control core gate
    types:
      - completed

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  report:
    if: github.event.workflow_run.head_branch == 'develop/workflow-control-core'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Build sanitized gate summary
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > jobs.json
          jq -r '
            .jobs[]
            | "### " + .name + " — " + (.conclusion // .status) + "\n"
              + ([.steps[] | "- " + .name + ": " + (.conclusion // .status)] | join("\n"))
          ' jobs.json > step-summary.md
          {
            printf '## Gate `%s` — %s\n\n' "${HEAD_SHA}" "${CONCLUSION}"
            printf 'Run: `%s`\n\n' "${RUN_ID}"
            cat step-summary.md
          } > comment.md

      - name: Publish private operational receipt
        shell: bash
        run: gh issue comment 15 --repo "${GITHUB_REPOSITORY}" --body-file comment.md
