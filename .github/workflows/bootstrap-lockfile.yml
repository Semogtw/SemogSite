name: Bootstrap verified pnpm lockfile

on:
  push:
    branches:
      - develop/foundation-bootstrap
    paths:
      - .github/workflows/bootstrap-lockfile.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-semogsite-lockfile
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and commit deterministic lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: develop/foundation-bootstrap
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          check-latest: false

      - name: Activate pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          node --version
          pnpm --version

      - name: Generate and verify lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile --ignore-scripts
          printf '%s  %s\n' \
            '88428903000c0e68c0d1a1fbcb5ff1aeb6b9967be15c51972b8ee98037a78eb5' \
            'pnpm-lock.yaml' | sha256sum -c -

      - name: Commit lockfile and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git rm .github/workflows/bootstrap-lockfile.yml
          git commit -m 'build: commit deterministic pnpm lockfile'
          git push origin HEAD:develop/foundation-bootstrap
