name: Apply verified orchestration context binding fix

on:
  pull_request_target:
    branches:
      - main
    paths:
      - .agent-patches/context-binding-fix.patch
      - .agent-patches/context-binding-fix.json

permissions:
  contents: write

concurrency:
  group: apply-context-binding-fix
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.ref == 'ops/apply-context-binding-fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout fixed owner request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: request
          persist-credentials: false
          sparse-checkout: .agent-patches
          sparse-checkout-cone-mode: false

      - name: Validate immutable request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          actual = json.loads(Path('request/.agent-patches/context-binding-fix.json').read_text())
          expected = {
              'repository': 'Semogtw/SemogSite',
              'branch': 'develop/workflow-control-core',
              'expected_head': '8593576d0dcc5c2e65d14e322618e3a4f5ba70dd',
              'patch_sha256': '061de5e0a6a20e46b893491a54244a4256f313cc0a90b0f1632f14b91c3cd27b',
              'expected_tree': '60e3ae4676fb33df44fb3d2e9e786d95fe201418',
              'commit_message': 'fix(domain): bind orchestration context identity',
          }
          if actual != expected:
              raise SystemExit('Request differs from reviewed fixed contract')
          PY
          test "$(sha256sum request/.agent-patches/context-binding-fix.patch | awk '{print $1}')" = \
            '061de5e0a6a20e46b893491a54244a4256f313cc0a90b0f1632f14b91c3cd27b'

      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: develop/workflow-control-core
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact tree and push with lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = '8593576d0dcc5c2e65d14e322618e3a4f5ba70dd'
          git -C target apply --index "$GITHUB_WORKSPACE/request/.agent-patches/context-binding-fix.patch"
          git -C target diff --cached --check
          test "$(git -C target write-tree)" = '60e3ae4676fb33df44fb3d2e9e786d95fe201418'
          git -C target config user.name 'Arthur Almeida'
          git -C target config user.email 'arthurgva1602@gmail.com'
          git -C target commit -m 'fix(domain): bind orchestration context identity'
          git -C target push \
            --force-with-lease='refs/heads/develop/workflow-control-core:8593576d0dcc5c2e65d14e322618e3a4f5ba70dd' \
            origin HEAD:refs/heads/develop/workflow-control-core
