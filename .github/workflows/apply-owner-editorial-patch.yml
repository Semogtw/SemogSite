name: Apply fixed owner editorial patch

on:
  pull_request_target:
    branches:
      - develop/editorial-workspace
    paths:
      - .agent-patches/editorial-lifecycle-request.json

permissions:
  contents: write

concurrency:
  group: apply-fixed-owner-editorial-patch
  cancel-in-progress: false

jobs:
  apply:
    name: Apply verified editorial lifecycle tree
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.ref == 'ops/editorial-lifecycle-apply'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout trusted workflow context
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Checkout fixed owner request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: request
          persist-credentials: false
          sparse-checkout: |
            .agent-patches/editorial-lifecycle-request.json
            .agent-patches/editorial-publish.diff.gz.b64
          sparse-checkout-cone-mode: false

      - name: Validate immutable request contract
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          request = json.loads(Path("request/.agent-patches/editorial-lifecycle-request.json").read_text())
          required = {
              "repository": "Semogtw/SemogSite",
              "branch": "develop/editorial-workspace",
              "base_commit": "b24763bf783811b77522a3cf56038d93ff984fb4",
              "expected_head": "39154d210f04e44c07352da5ed88010c5960fb36",
              "expected_patch_sha256": "5349156abc8733263119d616eabcad98913a2e004eb577d400222b743cdbacfc",
              "expected_tree": "6a1e7cc1fa0802bc0d834bbefa74cd6f7e04cc02",
              "commit_message": "feat(editorial): complete publication lifecycle controls",
          }
          if request != required:
              raise SystemExit("Request differs from the reviewed fixed contract")
          for key, value in request.items():
              print(f"{key}={value}")
          PY

      - name: Checkout target branch with repository token
        uses: actions/checkout@v6
        with:
          ref: develop/editorial-workspace
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Replace transport history with verified commit
        shell: bash
        env:
          EXPECTED_HEAD: ${{ steps.request.outputs.expected_head }}
          BASE_COMMIT: ${{ steps.request.outputs.base_commit }}
          EXPECTED_PATCH_SHA256: ${{ steps.request.outputs.expected_patch_sha256 }}
          EXPECTED_TREE: ${{ steps.request.outputs.expected_tree }}
          COMMIT_MESSAGE: ${{ steps.request.outputs.commit_message }}
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$EXPECTED_HEAD"
          base64 --decode request/.agent-patches/editorial-publish.diff.gz.b64 \
            | gzip --decompress > "$RUNNER_TEMP/editorial-lifecycle.patch"
          test "$(sha256sum "$RUNNER_TEMP/editorial-lifecycle.patch" | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"

          git -C target reset --hard "$BASE_COMMIT"
          git -C target apply --index "$RUNNER_TEMP/editorial-lifecycle.patch"
          git -C target diff --cached --check
          test "$(git -C target write-tree)" = "$EXPECTED_TREE"

          git -C target config user.name "Arthur Almeida"
          git -C target config user.email "arthurgva1602@gmail.com"
          git -C target commit -m "$COMMIT_MESSAGE"
          git -C target push \
            --force-with-lease="refs/heads/develop/editorial-workspace:${EXPECTED_HEAD}" \
            origin HEAD:refs/heads/develop/editorial-workspace
