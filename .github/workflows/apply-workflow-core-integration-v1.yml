name: Apply fixed workflow core integration patch

on:
  push:
    branches:
      - ops/apply-workflow-core-integration-v1
    paths:
      - .agent-patches/workflow-core-integration-trigger.json

permissions:
  contents: write

concurrency:
  group: apply-workflow-core-integration-v1
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout fixed request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: request
          persist-credentials: false
          sparse-checkout: .agent-patches/workflow-core-integration-trigger.json
          sparse-checkout-cone-mode: false

      - name: Validate reviewed request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
              'repository': 'Semogtw/SemogSite',
              'branch': 'develop/workflow-control-core',
              'expected_head': '1bfa719a807ca9fcb16b11666cd1f812d4638fdf',
              'commit_message': 'chore(orchestration): reconcile root exports and migrations',
          }
          actual = json.loads(Path('request/.agent-patches/workflow-core-integration-trigger.json').read_text())
          if actual != expected:
              raise SystemExit('Request differs from reviewed contract')
          PY

      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: develop/workflow-control-core
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact replacements
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = '1bfa719a807ca9fcb16b11666cd1f812d4638fdf'
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'target/packages/domain/src/index.ts': [
                  (
                      'export * from "./editorial";\n',
                      'export * from "./editorial";\nexport * from "./orchestration";\n',
                  ),
              ],
              'target/packages/database/src/backup/sqlite-backup.test.ts': [
                  (
                      '  "0010_editorial_redirect_registry.sql",\n] as const;',
                      '  "0010_editorial_redirect_registry.sql",\n  "0011_scope_reservations.sql",\n  "0012_verification_obligations.sql",\n  "0013_recovery_snapshots.sql",\n] as const;',
                  ),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              content = path.read_text()
              for old, new in pairs:
                  count = content.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}: expected one exact match, found {count}')
                  content = content.replace(old, new, 1)
              path.write_text(content)
          PY
          git -C target diff --check
          test "$(git -C target diff --name-only | sort | tr '\n' ' ')" = 'packages/database/src/backup/sqlite-backup.test.ts packages/domain/src/index.ts '

      - name: Commit and push with lease
        shell: bash
        run: |
          set -euo pipefail
          git -C target config user.name 'Arthur Almeida'
          git -C target config user.email 'arthurgva1602@gmail.com'
          git -C target add packages/domain/src/index.ts packages/database/src/backup/sqlite-backup.test.ts
          git -C target commit -m 'chore(orchestration): reconcile root exports and migrations'
          git -C target push --force-with-lease='refs/heads/develop/workflow-control-core:1bfa719a807ca9fcb16b11666cd1f812d4638fdf' origin HEAD:refs/heads/develop/workflow-control-core
